<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Ingresso Online</title>
</head>
<body class="m-4">
    <h1 class="display">Rafaela Oliveira Marques</h1>
    <div class="container">Atividade 7 - Bootstrap</div>
    <div class="container">Ingresso Online</div>
    
    <div class="container mt-4">
        <form action="needs-validation">
            <div class="input-group mb-3 position-relative">
                <label for="user" class="input-group-text">Usuário</label>
                <input type="text"  id="user" class="form-control is-valid" required>
                <div class="valid-tooltip">OK</div>
                <div class="invalid-feedback">Erro</div>
            </div>
            <div class="input-group">
                <label for="password" class="input-group-text">Senha</label>
                <input type="text"  id="password" class="form-control is-invalid" required>
                <div class="valid-feedback">OK</div>
                <div class="invalid-feedback">Erro</div>
            </div>
            <button class="btn btn-secondary mt-4">Entrar</button>
        </form>
    </div>
</body>
</html>
