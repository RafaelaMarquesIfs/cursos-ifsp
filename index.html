<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Page com Bootstrap</title>
</head>
<body class="m-4">
    <h1 class="display">Rafaela Oliveira Marques</h1>
    <div class="container">Atividade 4 - Bootstrap</div>
    <div class="container">Ingresso Online</div>
    <form >
        <fieldset>
            <div class="mb-3 mt-4">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" class="form-control">
                <div class="form-text">Preencha o seu nome completo</div>
            </div>
            <div class="mb-3 mt-4">
                <label for="email">E-mail:</label>
                <input type="text" placeholder="email@email.com" id="email" class="form-control">
            </div>
            <div class="mb-3 mt-4">
                <label for="">Escolha a cor da camiseta de brinde</label>
                <input type="color">
            </div>
            <div class="mb-3">
                <select name="" id="" class="form-control">
                    <option value="1">Arquibancada - Setor 1</option>
                    <option value="2">Arquibancada - Setor 2</option>
                    <option value="3">Arquibancada - Setor 3</option>
                    <option value="4">Arquibancada - Setor 4</option>
                    <option value="5">Área VIP</option>
                </select>
            </div>
            <input type="file" name="" id="">
            <button type="submit" class="btn btn-primary">Salvar </button>
            <button type="submit" class="btn btn-primary">Limpar </button>
        </fieldset>
    </form>
</body>
</html>
