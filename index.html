<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Page com Bootstrap</title>
</head>
<body class="m-4">
    <h1 class="display">Rafaela Oliveira Marques</h1>
    <div class="container">Atividade 6 - Bootstrap</div>
    <div class="container">Ingresso Online</div>
    <form >
        <fieldset>
            <div class="mb-3 mt-4 input-group">
                <label class="input-group-text" for="nome">Nome:</label>
                <input type="text" id="nome" class="form-control" placeholder="Preencha o seu nome completo">
            </div>
            <div class="mb-3 mt-4">
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com">
                    <label for="email">E-mail:</label>
                </div>
            </div>
            <div class="mb-3 mt-4">
                <label for="">Escolha a cor da camiseta de brinde</label>
                <input type="color">
            </div>
            <div class="mb-3">
                <select name="" id="" class="form-select" multiple size="3">
                    <option value="1">Arquibancada - Setor 1</option>
                    <option value="2">Arquibancada - Setor 2</option>
                    <option value="3">Arquibancada - Setor 3</option>
                    <option value="4">Arquibancada - Setor 4</option>
                    <option value="5">Área VIP</option>
                </select>      
            </div>
            <div class="container>
                <label for="meurange" class="form-label">Quantidade</label>
                <input type="range" class="form-range" min="0" max="5" step="1" >
            </div>
            <div class="mb-3">
                <label for="estado">Estado: </label>
                <input type="text" id="estado" list="estados" class="form-control" placeholder="Digite sua cidade">
                <datalist id="estados">
                    <option value="São Paulo"></option>
                    <option value="Sergipe"></option>
                    <option value="Bahia"></option>
                    <option value="Acre"></option>
                    <option value="Amapá"></option>
                    <option value="Paraná"></option>
                    <option value="Maranhão"></option>
                </datalist>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" id="admin" class="form-check-input">
                    <label for="admin">Admin?</label>
                </div>
            </div>
            <div class="mb-3">
                <div class="form-check form-switch form-check-reverse">
                    <input type="checkbox" id="admin" class="form-check-input">
                    <label for="admin">Admin?</label>
                </div>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <label for="m">Masculino</label>
                    <input type="radio" name="sexo" id="m" value="m"  class="form-check-input"></input>
                </div>
                <div class="form-check">
                    <label for="f">Feminino</label>
                    <input type="radio" name="sexo" id="f" value="f"  class="form-check-input"></input>
                </div>
            </div>

            <input type="file" name="" id="">
            <button type="submit" class="btn btn-primary">Salvar </button>
            <button type="submit" class="btn btn-primary">Limpar </button>
        </fieldset>
    </form>
</body>
</html>
