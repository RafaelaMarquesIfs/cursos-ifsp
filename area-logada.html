<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Ingresso Online</title>
</head>
<body class="m-4">
    <h1 class="display">Rafaela Oliveira Marques</h1>
    <div class="container">Atividade 7 - Bootstrap</div>
    <div class="container">Ingresso Online</div>
    <button class="btn btn-primary m-4">Atualizações  
        <span class="badge text-bg-secondary">4</span>
    </button>

   <div class="container">
        <div class="accordion" id="menu">
            <div class="accordion-item">
                <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#m1">Evento 1</button>
                <div id="m1" class="accordion-body collapse" data-bs-parent="#menu">Conteúdo Evento 1</div>
            </div>
            <div class="accordion-item">
                <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#m2">Evento 2</button>
                <div id="m2" class="accordion-body collapse" data-bs-parent="#menu">Conteúdo Evento 2</div>
            </div>
        </div>
   </div>
   <div class="container mt-4">
        <div class="alert alert-primary alert-dismissible">Evento com os ingressos se esgotando
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>
   </div>
</body>
</html>
